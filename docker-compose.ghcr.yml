# Run the published images instead of building. Apply ON TOP of
# docker-compose.yml, in OpenLobby's project like it (from this directory):
#
#   docker compose --project-directory ../openlobby \
#       --env-file ../openlobby/.env --env-file .env \
#       -f ../openlobby/docker-compose.yml -f docker-compose.yml \
#       -f docker-compose.ghcr.yml pull bridge
#
# and the same with `up -d` in place of `pull bridge`. Needs Docker Compose
# 2.24 or newer (the `!reset` that drops the build step).

services:
  bridge:
    image: ghcr.io/prettyopenlobby/hippaulbridge:${HIPPAULBRIDGE_TAG:-${CRYSTALBRIDGE_TAG:-latest}}
    pull_policy: missing
    build: !reset null
